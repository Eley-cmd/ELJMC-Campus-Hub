<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4c1d95" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>ELJMC Campus Hub</title>
  <script>
    // Apply the saved light/dark theme before first paint (no flash). The app colour is always violet.
    try {
      var t = localStorage.getItem('eljmc.theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      localStorage.removeItem('eljmc.accent');
    } catch (e) {}
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
